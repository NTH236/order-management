server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:order_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# SOA Inter-service communication endpoints
services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

